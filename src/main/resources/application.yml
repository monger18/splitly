spring:
  application:
    name: splitly

  datasource:
    url: jdbc:postgresql://localhost:5432/splitly
    username: splitly
    password: splitly

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities match it.
      # Never use ddl-auto: update in a real project - it silently drifts.
      ddl-auto: validate
    # Closes the persistence context at the end of the service call, not the HTTP
    # response. Forces you to fetch what you need up front instead of relying on
    # lazy loading in the controller. Boot warns if you leave this on the default.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  devtools:
    restart:
      # Watches target/classes and restarts the application context when the
      # compiled classes change. It reloads only your classes, not the whole JVM,
      # so a restart is roughly a second instead of the full seven.
      # It is triggered by RECOMPILING, not by saving a .java file - see CLAUDE.md.
      enabled: true
    livereload:
      # Browser refresh hook. There is no front end in this project.
      enabled: false

splitly:
  jwt:
    secret: ${SPLITLY_JWT_SECRET:local-development-only-splitly-signing-key-change-me}
    issuer: splitly
    # Short-lived, because a stolen access token cannot be revoked - it simply has to
    # expire. The refresh token is long-lived but is only ever sent to /auth/refresh.
    access-token-ttl: 15m
    refresh-token-ttl: 30d

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    # Shows the SQL Hibernate actually runs - the fastest way to spot N+1 queries.
    org.hibernate.SQL: debug
